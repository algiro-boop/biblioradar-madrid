[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biblioradar-madrid"
version = "0.1.0"
description = "Ingesta oficial y base de datos de BiblioRadar Madrid"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "python-dotenv>=1.1,<2"]

[project.scripts]
biblioradar-ingest = "biblioradar.ingest:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pglast>=7,<8"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/biblioradar"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
