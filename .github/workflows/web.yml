name: BiblioRadar web
on:
  push:
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  tablet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build -- --webpack
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_biblioradar_test
      - run: npx playwright install --with-deps webkit chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
