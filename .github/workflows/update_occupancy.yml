name: BiblioRadar occupancy

on:
  push:
    paths: ['src/**', 'tests/**', 'sync_csv_to_supabase.py', 'data/csv/**', 'supabase/**', 'pyproject.toml', 'uv.lock', '.github/workflows/update_occupancy.yml']
  pull_request:
  # Respaldo del cron principal de Supabase (cada 5 min, migración 007).
  # GitHub puede retrasar/saltar ejecuciones; la disponibilidad no depende de este cron.
  schedule:
    - cron: '14,29,44,59 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Contar centros del CSV sin modificar Supabase
        type: boolean
        default: true

permissions:
  contents: read

# El cron no espera detrás de una validación de un push: grupos separados por tipo de ejecución.
concurrency:
  group: occupancy-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'update' || 'validate' }}
  cancel-in-progress: false

jobs:
  # Tests completos con PostgreSQL solo al cambiar código; nunca en las ejecuciones del cron.
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: biblioradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/biblioradar_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: command -v psql
      - run: uv run pytest -q

  # Sin `needs: validate`: arranca sin esperar al contenedor de PostgreSQL (< 1 min en total).
  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: '3.11'
      - run: uv sync --locked --no-dev
      - name: Update or preview
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            uv run --no-dev python -m biblioradar.csv_job --dry-run
          else
            uv run --no-dev python -m biblioradar.csv_job
          fi
